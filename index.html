<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d1c">
    <title>JARVIS | Personal AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f3f7ff;
            background: radial-gradient(circle at top, #172b50, #080d1c 65%);
            display: flex;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 24px 14px;
        }
        header { text-align: center; padding: 18px 0; }
        .orb {
            width: 82px;
            height: 82px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: radial-gradient(circle, #c6ffff, #35b9ff 38%, #246bff 70%);
            box-shadow: 0 0 28px #35b9ff99, 0 0 65px #246bff44;
        }
        h1 {
            margin: 0;
            letter-spacing: 7px;
            font-size: 30px;
            color: #8eeaff;
        }
        .subtitle { color: #a9b9d5; margin-top: 9px; }
        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 12px;
            border: 1px solid #294a70;
            border-radius: 20px;
            color: #9ee7ff;
            font-size: 12px;
        }
        .panel {
            background: #111b2de8;
            border: 1px solid #263955;
            border-radius: 18px;
            padding: 18px;
        }
        .panel h2 { font-size: 16px; margin-top: 0; }
        #chat {
            min-height: 210px;
            max-height: 42vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 14px;
            border-radius: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        .jarvis {
            background: #1a2b43;
            border: 1px solid #2b4765;
            align-self: flex-start;
        }
        .user {
            background: #174b69;
            align-self: flex-end;
        }
        .controls {
            display: flex;
            gap: 9px;
            margin-top: 14px;
        }
        Input {
            min-width: 0;
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            Border: 1px solid #344a68;
            Background: #080f1e;
            Color: white;
            Font-size: 15px;
        }
        Button {
            Cursor: pointer;
            Border: 0;
            Border-radius: 12px;
            Padding: 12px 15px;
            Color: #061321;
            Background: #79ddff;
            Font-weight: bold;
        }
        Button:active { transform: scale(.97); }
        .secondary {
            Color: #dceaff;
            Background: #263953;
        }
        .actions {
            Display: flex;
            Flex-wrap: wrap;
            Gap: 10px;
            Margin-top: 14px;
        }
        .note {
            Color: #9daec7;
            Font-size: 12px;
            Line-height: 1.6;
        }
        Footer {
            Text-align: center;
            Color: #7387a5;
            Font-size: 12px;
            Padding: 8px;
        }
        @media (max-width: 420px) {
            .controls { flex-wrap: wrap; }
            .controls input { flex-basis: 100%; }
            H1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="orb"></div>
            <h1>JARVIS</h1>
            <div class="subtitle">Your Personal AI Assistant</div>
            <div class="status">Interface Ready</div>
        </header>

        <section class="panel">
            <h2>Talk to JARVIS</h2>
            <div id="chat" aria-live="polite">
                <div class="message jarvis">
                    Hey boss! আমি JARVIS। কীভাবে সাহায্য করতে পারি?
                </div>
            </div>
            
            <form id="chatForm" class="controls">
                <input id="userInput" type="text" placeholder="Type your message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>

            <div class="actions">
                <button type="button" class="secondary" id="voiceBtn">Voice Input</button>
                <button type="button" class="secondary" id="speakBtn">Voice Reply</button>
                <button type="button" class="secondary" id="clearBtn">Clear Chat</button>
            </div>
        </section>

        <p class="note">Voice features depend on your browser and device. AI answers, web search, and saved memory will be added in later versions.</p>

        <footer>JARVIS Personal AI - Version 1.0</footer>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("userInput");
        let lastReply = "Hey boss! বলুন, কীভাবে সাহায্য করতে পারি?";

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = "message " + type;
            message.textContent = text;
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("chatForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user");
            input.value = "";

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    Body: JSON.stringify({ prompt: text })
                });
                const data = await res.json();
                const aiReply = data.reply || "No response generated";
                LastReply = aiReply;
                AddMessage(aiReply, "jarvis");
            } catch (err) {
                Console.error(err);
                AddMessage("Error connecting to server.", "jarvis");
            }
        });

        Document.getElementById("clearBtn").addEventListener("click", () => {
            Chat.replaceChildren();
            LastReply = "Hey boss! বলুন, কীভাবে সাহায্য করতে পারি?";
            AddMessage(lastReply, "jarvis");
        });

        Document.getElementById("speakBtn").addEventListener("click", () => {
            if (!("speechSynthesis" in window)) {
                AddMessage("এই ব্রাউজারে Voice Reply সমর্থিত নয়।", "jarvis");
                Return;
            }
            Window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(lastReply);
            Utterance.lang = "bn-BD";
            Window.speechSynthesis.speak(utterance);
        });

        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!recognition) {
            AddMessage("Voice Input এই ব্রাউজারে সমর্থিত নয়। Chrome-এ চেষ্টা করো বা টাইপ করো।", "jarvis");
        } else {
            Const recognitionInstance = new Recognition();
            RecognitionInstance.lang = "bn-BD";
            RecognitionInstance.onresult = (event) => {
                Input.value = event.results[0][0].transcript;
                Input.focus();
            };
            RecognitionInstance.onerror = () => {
                AddMessage("ভয়েস নেওয়া যায়নি। আবার চেষ্টা করো।", "jarvis");
            };

            Document.getElementById("voiceBtn").addEventListener("click", () => {
                RecognitionInstance.start();
            });
        }
    </script>
</body>
</html>
